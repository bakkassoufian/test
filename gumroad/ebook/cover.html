<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover</title>
<style>
    @import url('fonts.css');

    @page { size: A4; margin: 0; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        width: 210mm;
        height: 297mm;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    body {
        font-family: 'Outfit', sans-serif;
        color: #f8fafc;
        background:
            radial-gradient(circle at 8% 4%, rgba(79, 70, 229, 0.75) 0, rgba(79, 70, 229, 0) 42%),
            radial-gradient(circle at 98% 92%, rgba(219, 39, 119, 0.6) 0, rgba(219, 39, 119, 0) 40%),
            radial-gradient(circle at 75% 42%, rgba(6, 182, 212, 0.35) 0, rgba(6, 182, 212, 0) 30%),
            #0f172a;
        overflow: hidden;
        position: relative;
        padding: 26mm 22mm;
        display: flex;
        flex-direction: column;
    }

    .label {
        display: inline-block;
        align-self: flex-start;
        font-size: 10pt;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 7px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.06);
        color: #c4b5fd;
    }

    h1 {
        margin-top: 22mm;
        font-size: 58pt;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.02em;
    }

    h1 span {
        color: #c4b5fd;
    }

    .sub {
        margin-top: 9mm;
        font-size: 15pt;
        font-weight: 400;
        line-height: 1.45;
        color: #cbd5e1;
        max-width: 135mm;
    }

    .steps {
        margin-top: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4mm;
    }

    .step {
        border-radius: 16px;
        padding: 6mm 4mm;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .step b {
        display: block;
        font-size: 22pt;
        font-weight: 800;
        color: #a78bfa;
        line-height: 1;
        margin-bottom: 3mm;
    }

    .step span {
        font-size: 11pt;
        font-weight: 600;
    }

    .footer {
        margin-top: 14mm;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12pt;
        color: #94a3b8;
    }

    .footer strong {
        color: #f8fafc;
        font-weight: 700;
        font-size: 14pt;
    }
</style>
</head>
<body>
    <div class="label">The beginner's guide</div>
    <h1>Your First<br><span>Digital Product</span></h1>
    <p class="sub">A step-by-step guide to creating, launching and selling on Gumroad — even with no audience.</p>

    <div class="steps">
        <div class="step"><b>01</b><span>Find the idea</span></div>
        <div class="step"><b>02</b><span>Create it</span></div>
        <div class="step"><b>03</b><span>Launch it</span></div>
        <div class="step"><b>04</b><span>Sell &amp; grow</span></div>
    </div>

    <div class="footer">
        <strong>Waslerr</strong>
        <span>10 chapters · 30-day plan · 3 worksheets</span>
    </div>
</body>
</html>
